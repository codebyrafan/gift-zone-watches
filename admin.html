<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Gift Zone Watches</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">GIFT<span>ZONE</span></a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <div class="container">
                <h1>Admin Dashboard</h1>
                <p style="color: var(--text-muted);">Manage your product catalogue</p>
            </div>
        </div>

        <div class="container">
            <!-- Stats Overview -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- Actions Bar -->
            <div style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <button class="btn btn-primary" onclick="openProductModal()">+ Add New Product</button>
                <div>
                    <button class="btn btn-secondary" onclick="bulkDelete()">Delete Selected</button>
                </div>
            </div>

            <!-- Products Table -->
            <div style="overflow-x: auto;">
                <table class="admin-table" id="productsTable">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Brand</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Featured</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeProductModal()">&times;</span>
            <h2 id="modalTitle">Add New Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="prodName" required>
                </div>
                <div class="form-group">
                    <label>Brand *</label>
                    <input type="text" id="prodBrand" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="prodCategory" required>
                        <option value="Diver">Diver</option>
                        <option value="Chronograph">Chronograph</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Dress">Dress</option>
                        <option value="Racing">Racing</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (AED) *</label>
                    <input type="number" id="prodPrice" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="prodStock" value="0">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="prodImage" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="prodFeatured"> Featured Product
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Product</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
