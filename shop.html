<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Gift Zone Watches</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">GIFT<span>ZONE</span></a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
                <a href="admin-login.html">Admin</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </nav>

    <div style="padding-top: 100px;">
        <div class="container">
            <h1 style="margin-bottom: 16px;">Our Collection</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px;">Discover exceptional timepieces from the world's finest watchmakers</p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="container">
                <div class="filter-group">
                    <div class="filter-controls">
                        <input type="text" id="searchInput" placeholder="Search watches..." class="search-input">
                        <select id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="Diver">Diver</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Dress">Dress</option>
                            <option value="Racing">Racing</option>
                        </select>
                        <select id="brandFilter">
                            <option value="">All Brands</option>
                            <option value="Rolex">Rolex</option>
                            <option value="Omega">Omega</option>
                            <option value="Audemars Piguet">Audemars Piguet</option>
                            <option value="Patek Philippe">Patek Philippe</option>
                            <option value="TAG Heuer">TAG Heuer</option>
                            <option value="Cartier">Cartier</option>
                        </select>
                        <select id="sortFilter">
                            <option value="featured">Featured</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                    <div class="active-filters" id="activeFilters"></div>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="container">
            <div id="resultCount" style="margin-bottom: 24px; color: var(--text-muted);"></div>
            <div class="product-grid" id="productsGrid"></div>
            <div id="loader" class="loader" style="display: none;"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div>
                    <h4>GIFT ZONE WATCHES</h4>
                    <p style="color: var(--text-muted);">Premium luxury timepieces curated for discerning collectors in the UAE.</p>
                </div>
                <div>
                    <h4>Quick Links</h4>
                    <a href="shop.html">Shop</a>
                    <a href="#about">About Us</a>
                    <a href="#contact">Contact</a>
                </div>
                <div>
                    <h4>Contact</h4>
                    <a href="https://wa.me/971500000000">+971 50 000 0000</a>
                    <a href="mailto:info@giftzone.ae">info@giftzone.ae</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
