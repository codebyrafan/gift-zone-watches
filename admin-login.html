<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Gift Zone Watches</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="background: var(--surface); padding: 48px; max-width: 400px; width: 90%; border: 1px solid var(--border);">
        <div style="text-align: center; margin-bottom: 32px;">
            <a href="index.html" class="logo" style="font-size: 28px;">GIFT<span>ZONE</span></a>
            <p style="color: var(--text-muted); margin-top: 16px;">Admin Access</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="admin@giftzone.ae">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login →</button>
        </form>
        
        <div id="errorMsg" style="color: var(--out-of-stock); margin-top: 16px; text-align: center; display: none;"></div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
